# 180Climate Fieldwork: A2A endpoint. Static files from public/, the endpoint
# itself is netlify/functions/a2a.mts (served at /a2a).
[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/.well-known/agent-card.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"
